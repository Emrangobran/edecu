name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pytest
        # أضف أي متطلبات أخرى هنا
    
    - name: Run tests
      run: pytest
    
    # 🐳 Docker build
    - name: Build Docker Image
      run: docker build -t my-app .
    
    # (اختياري) تشغيل الحاوية للاختبار
    - name: Test Docker container
      run: |
        docker run --rm my-app python -c "print('Docker OK')"