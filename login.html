<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصتي</title>
    <!-- إضافة Favicon -->
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/color/48/000000/book--v1.png">
    <!-- إضافة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #667eea; 
            --primary-dark: #5a6fd1;
            --bg: #F3F4F6; 
            --success: #4caf50;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        
        .container {
            background: white; padding: 2.5rem; border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 100%; max-width: 400px;
            text-align: center; position: relative;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .back-link { 
            position: absolute; top: 15px; left: 15px; 
            text-decoration: none; color: #999; font-size: 0.9rem; 
            transition: 0.3s; display: flex; align-items: center; gap: 5px;
        }
        .back-link:hover { color: var(--primary); }
        
        .logo { 
            font-size: 2rem; font-weight: bold; 
            color: var(--primary); margin-bottom: 1rem; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        
        .tabs { 
            display: flex; margin-bottom: 2rem; 
            border-bottom: 2px solid #eee; 
            background: #f8f9fa;
            padding: 5px;
            border-radius: 50px;
        }
        .tab { 
            flex: 1; padding: 12px; cursor: pointer; 
            color: #666; transition: 0.3s; font-weight: 500;
            border-radius: 50px;
        }
        .tab.active { 
            color: white; 
            background: var(--primary);
        }
        
        .form-group { 
            margin-bottom: 1.2rem; 
            text-align: right;
        }
        
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
        input, select { 
            width: 100%; padding: 0.8rem 0.8rem 0.8rem 2.5rem; 
            border: 1px solid #D1D5DB; border-radius: 0.5rem; 
            box-sizing: border-box; font-size: 1rem; 
            outline: none; transition: 0.3s; 
        }
        input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); 
        }
        
        .btn { 
            width: 100%; padding: 0.8rem; 
            background: var(--primary); color: white; 
            border: none; border-radius: 0.5rem; 
            cursor: pointer; margin-top: 0.5rem; 
            font-size: 1rem; font-weight: bold; 
            transition: 0.3s; display: flex;
            align-items: center; justify-content: center; gap: 10px;
        }
        .btn:hover { 
            background: var(--primary-dark); 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        /* زر جوجل */
        .google-btn {
            background: white; color: #333; border: 1px solid #ddd;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 15px;
        }
        .google-btn:hover { 
            background: #f9f9f9; 
            border-color: #ccc;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .divider { 
            margin: 20px 0; position: relative; 
            display: flex; align-items: center; justify-content: center;
        }
        .divider::before { 
            content: ""; position: absolute; top: 50%; 
            left: 0; width: 100%; height: 1px; 
            background: #eee; 
        }
        .divider span { 
            position: relative; background: white; 
            padding: 0 10px; color: #999; font-size: 0.9rem; 
        }

        .hidden { display: none; }
        
        .remember-me {
            display: flex; align-items: center; gap: 8px;
            margin-top: 10px; color: #666;
        }
        .remember-me input {
            width: auto;
        }
        
        .alert {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .alert.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            الرئيسية
        </a>
        <span class="logo">
            <i class="fas fa-graduation-cap"></i>
            منصتي
        </span>

        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">
                <i class="fas fa-sign-in-alt"></i> تسجيل دخول
            </div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">
                <i class="fas fa-user-plus"></i> حساب جديد
            </div>
        </div>

        <!-- رسالة التنبيه -->
        <div id="alertMessage" class="alert">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertText"></span>
        </div>

        <!-- نموذج الدخول -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                </div>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">تذكرني</label>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                دخول
            </button>
        </form>

        <!-- نموذج التسجيل -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="registerName" placeholder="الاسم الكامل" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="البريد الإلكتروني" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-briefcase"></i>
                    <select id="roleSelect">
                        <option value="student"><i class="fas fa-user-graduate"></i> طالب (أريد أن أتعلم)</option>
                        <option value="instructor"><i class="fas fa-chalkboard-teacher"></i> مدرب (أريد أن أُعَلِّم)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="كلمة المرور" required>
                </div>
            </div>
            
            <button type="submit" class="btn" id="registerBtn">
                <i class="fas fa-user-plus"></i>
                إنشاء حساب
            </button>
        </form>

        <!-- زر جوجل الموحد -->
        <div class="divider"><span>أو</span></div>
        <button type="button" class="btn google-btn" onclick="handleGoogleLogin()" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            المتابعة باستخدام Google
        </button>

    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('mode') === 'register') {
                switchTab('register');
            }
            
            // التحقق من وجود جلسة سابقة
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe === 'true') {
                // يمكن توجيه المستخدم تلقائياً إذا كان مسجلاً
                // window.location.href = 'index.html';
            }
        }

        function switchTab(tabName) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const alertDiv = document.getElementById('alertMessage');

            if (tabName === 'login') {
                loginForm.classList.remove('hidden'); 
                registerForm.classList.add('hidden');
                tabLogin.classList.add('active'); 
                tabRegister.classList.remove('active');
            } else {
                loginForm.classList.add('hidden'); 
                registerForm.classList.remove('hidden');
                tabLogin.classList.remove('active'); 
                tabRegister.classList.add('active');
            }
            
            // إخفاء أي رسائل سابقة
            alertDiv.classList.remove('show');
        }

        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alertMessage');
            const alertText = document.getElementById('alertText');
            
            alertText.innerText = message;
            alertDiv.className = 'alert show';
            
            if (type === 'success') {
                alertDiv.style.background = '#d4edda';
                alertDiv.style.color = '#155724';
            } else {
                alertDiv.style.background = '#f8d7da';
                alertDiv.style.color = '#721c24';
            }
            
            // إخفاء تلقائي بعد 3 ثوان
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 3000);
        }

        function setLoading(buttonId, isLoading) {
            const button = document.getElementById(buttonId);
            const originalText = button.innerHTML;
            
            if (isLoading) {
                button.disabled = true;
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحميل...';
            } else {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            setLoading('loginBtn', true);
            
            // محاكاة التحقق من صحة البيانات
            setTimeout(() => {
                if (email && password.length >= 6) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', email.split('@')[0]); // اسم من البريد
                    localStorage.setItem('userRole', 'طالب');
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    }
                    
                    showAlert('تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة');
                    setLoading('loginBtn', false);
                }
            }, 1500);
        }

        function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const role = document.getElementById('roleSelect').value;
            const password = document.getElementById('registerPassword').value;
            
            setLoading('registerBtn', true);
            
            // محاكاة إنشاء حساب
            setTimeout(() => {
                if (name && email && password.length >= 6) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', name);
                    localStorage.setItem('userRole', role === 'student' ? 'طالب' : 'مدرب');
                    
                    showAlert('✅ تم إنشاء الحساب بنجاح!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert('❌ يرجى التأكد من صحة جميع البيانات (كلمة المرور 6 أحرف على الأقل)');
                    setLoading('registerBtn', false);
                }
            }, 1500);
        }

        function handleGoogleLogin() {
            const googleBtn = document.getElementById('googleBtn');
            
            googleBtn.disabled = true;
            googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال بـ Google...';
            
            // محاكاة تسجيل الدخول بجوجل
            setTimeout(() => {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', 'مستخدم Google');
                localStorage.setItem('userRole', 'طالب');
                
                showAlert('✅ تم تسجيل الدخول بحساب Google', 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }, 2000);
        }
        
        // إضافة التحقق المباشر من صحة كلمة المرور
        document.getElementById('registerPassword')?.addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthIndicator = document.createElement('div');
            
            if (!document.getElementById('password-strength')) {
                strengthIndicator.id = 'password-strength';
                strengthIndicator.style.fontSize = '12px';
                strengthIndicator.style.marginTop = '5px';
                e.target.parentNode.appendChild(strengthIndicator);
            } else {
                strengthIndicator = document.getElementById('password-strength');
            }
            
            if (password.length < 6) {
                strengthIndicator.innerHTML = '⚠️ كلمة المرور ضعيفة (أقل من 6 أحرف)';
                strengthIndicator.style.color = '#dc3545';
            } else if (password.length < 10) {
                strengthIndicator.innerHTML = '✓ كلمة المرور متوسطة';
                strengthIndicator.style.color = '#ffc107';
            } else {
                strengthIndicator.innerHTML = '✓✓ كلمة المرور قوية';
                strengthIndicator.style.color = '#28a745';
            }
        });
    </script>
</body>
</html>
